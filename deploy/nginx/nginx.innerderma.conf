# InnerDerma Production Nginx Config (HTTPS)
# Replace <domain> with actual domain before deploying.
# Copy to deploy/nginx/active.conf

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;

    client_max_body_size 12m;

    # API (Spring Boot)
    location /api/ {
        proxy_pass http://app-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://app-api:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://app-api:8080/api-docs;
        proxy_set_header Host $host;
    }

    # Actuator health
    location /actuator/health {
        proxy_pass http://app-api:8080/actuator/health;
    }

    # 피부 사진 (정적 파일로 서빙할 경우)
    location /skin-captures/ {
        proxy_pass http://app-api:8080/skin-captures/;
        proxy_set_header Host $host;
    }

    # 기본 (프론트엔드가 별도 도메인이면 여기는 API only)
    location / {
        return 200 '{"service":"InnerDerma API","status":"running"}';
        add_header Content-Type application/json;
    }
}
