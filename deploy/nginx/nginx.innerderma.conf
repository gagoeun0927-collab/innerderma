# InnerDerma 통합 Nginx 설정
# 두 도메인 모두 이 nginx에서 처리:
#   - inner-derma.duckdns.org → InnerDerma (백엔드 + 프론트)
#   - skinage-api.duckdns.org → SkinAge API
#
# 사용법: cp deploy/nginx/nginx.innerderma.conf deploy/nginx/active.conf

# === HTTP → HTTPS 리다이렉트 (두 도메인 공통) ===
server {
    listen 80;
    server_name inner-derma.duckdns.org skinage-api.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# === InnerDerma (inner-derma.duckdns.org) ===
server {
    listen 443 ssl;
    server_name inner-derma.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/inner-derma.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inner-derma.duckdns.org/privkey.pem;

    client_max_body_size 12m;

    # Spring Boot API
    location /api/ {
        proxy_pass http://app-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI
    location /swagger-ui/ {
        proxy_pass http://app-api:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /api-docs {
        proxy_pass http://app-api:8080/api-docs;
        proxy_set_header Host $host;
    }

    # Actuator
    location /actuator/ {
        proxy_pass http://app-api:8080/actuator/;
        proxy_set_header Host $host;
    }

    # 프론트엔드 (SPA — React/Vue/etc)
    location / {
        root /usr/share/nginx/html/innerderma;
        try_files $uri /index.html;
    }
}

# === SkinAge (skinage-api.duckdns.org) ===
server {
    listen 443 ssl;
    server_name skinage-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/skinage-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skinage-api.duckdns.org/privkey.pem;

    client_max_body_size 12m;

    # SkinAge API
    location /api/ {
        proxy_pass http://skinage:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SkinAge Swagger
    location /docs {
        proxy_pass http://skinage:8000/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://skinage:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Health
    location /health {
        proxy_pass http://skinage:8000/api/v1/health;
    }

    location / {
        return 404 '{"detail":"Not Found"}';
        add_header Content-Type application/json;
    }
}
