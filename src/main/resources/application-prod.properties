# InnerDerma Production Profile
# 모든 시크릿은 환경변수로 주입 (docker-compose.prod.yml 또는 /opt/innerderma.env)

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/innerderma?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:innerderma_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

innerderma.skin-capture.storage-path=${INNERDERMA_SKIN_CAPTURE_STORAGE_PATH:/data/skin-captures}
skinage.base-url=${SKINAGE_BASE_URL:http://skinage:8000}
openai.api-key=${OPENAI_API_KEY}

# Swagger (prod에서도 접근 가능 — 시연용)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET}
jwt.validity-hours=24

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
