spring.datasource.url=jdbc:h2:mem:innerderma-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# 테스트에서는 Flyway 비활성화 (H2 create-drop 사용)
spring.flyway.enabled=false

# 테스트용 설정
innerderma.skin-capture.storage-path=./build/test-captures
skinage.base-url=http://localhost:9999
openai.api-key=
jwt.secret=test-secret-key-must-be-at-least-32-bytes-long
jwt.validity-hours=24
cors.allowed-origins=*
