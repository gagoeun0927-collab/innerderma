services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: innerderma
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-api:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file: /opt/innerderma.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/innerderma?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      INNERDERMA_SKIN_CAPTURE_STORAGE_PATH: /data/skin-captures
      SKINAGE_BASE_URL: http://skinage:8000
      TZ: Asia/Seoul
    volumes:
      - skin-captures:/data/skin-captures
    expose:
      - "8080"

  skinage:
    build:
      context: /opt/skinage/SkinAge
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    expose:
      - "8000"
    volumes:
      - /opt/skinage/SkinAge/outputs/models:/app/outputs/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app-api
      - skinage
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ${FRONTEND_BUILD_PATH:-./frontend-dist}:/usr/share/nginx/html/innerderma:ro

volumes:
  mysql-data:
  skin-captures:
